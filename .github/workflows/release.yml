name: Build & Release LINKDROP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure Keystore & Build APK
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true
          flutter pub get
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows Desktop EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop Support
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Package Windows Bundle into ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "LINKDROP-Windows.zip"

      - name: Upload Windows Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: LINKDROP-Windows.zip

  publish-release:
    name: Publish Release & Generate In-App Update Manifest
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release-files/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: release-files/

      - name: Rename and Generate SHA-256 Manifest
        working-directory: release-files
        run: |
          mv app-release.apk LINKDROP.apk

          TAG="${GITHUB_REF_NAME:-v1.0.0}"
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          APK_SHA=$(sha256sum LINKDROP.apk | awk '{print $1}')
          WIN_SHA=$(sha256sum LINKDROP-Windows.zip | awk '{print $1}')

          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "release_date": "$PUB_DATE",
            "release_notes": "🚀 LINKDROP $VERSION: High-speed direct video downloader, live player preview, Range resumption, and in-app updates.",
            "mandatory": false,
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/LINKDROP.apk",
            "sha256_apk": "$APK_SHA",
            "exe_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/LINKDROP-Windows.zip",
            "sha256_exe": "$WIN_SHA"
          }
          EOF

          echo "Generated latest.json:"
          cat latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          tag_name: ${{ github.ref_name }}
          name: LINKDROP ${{ github.ref_name }}
          body: |
            ## 🚀 LINKDROP ${{ github.ref_name }}

            Direct Video Downloader for **Android** and **Windows**.

            ### 📦 Direct Downloads:
            - 📱 **Android APK**: [`LINKDROP.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LINKDROP.apk)
            - 💻 **Windows Desktop (Zip Bundle)**: [`LINKDROP-Windows.zip`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LINKDROP-Windows.zip)
            - 📄 **In-App Auto-Update Manifest**: [`latest.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json)

            ### ✨ Highlights:
            - **Native HTTP/HTTPS Streaming**: Downloads large files chunk by chunk without memory exhaustion.
            - **HTTP Range Resume**: Pauses and resumes seamlessly from byte offset.
            - **Smart Link Detection & SSRF Defense**: Guards against private-network attacks.
            - **Live Video Preview & Offline Player**: Play and inspect videos directly inside the app.
            - **Khmer & English Support**: Switch between ភាសាខ្មែរ and English in Settings.
            - **In-App Auto-Update**: Checks GitHub Releases, verifies SHA-256 integrity, and installs updates in-app without needing a browser!
          draft: false
          prerelease: false
