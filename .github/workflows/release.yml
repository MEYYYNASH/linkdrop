name: Build & Release LINKDROP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Build Genuine LINKDROP Android APK
        run: |
          mkdir -p /tmp/backup_app
          cp -r lib /tmp/backup_app/
          cp pubspec.yaml /tmp/backup_app/
          cp debug.keystore /tmp/backup_app/

          # Clean and generate pristine Android project wrapper
          rm -rf android
          flutter create --platforms=android --org com.linkdrop --project-name linkdrop .

          # Restore our app code and pubspec
          rm -rf lib
          cp -r /tmp/backup_app/lib .
          cp /tmp/backup_app/pubspec.yaml .

          # Setup fixed permanent debug keystore for deterministic APK signing
          mkdir -p ~/.android
          cp /tmp/backup_app/debug.keystore ~/.android/debug.keystore
          mkdir -p android/app
          cp /tmp/backup_app/debug.keystore android/app/debug.keystore

          # Safely inject permissions into AndroidManifest.xml
          python3 -c "
          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()
          perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>
              <uses-permission android:name=\"android.permission.REQUEST_INSTALL_PACKAGES\"/>
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\"/>
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>
          '''
          content = content.replace('<application', perms + '    <application')
          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)
          "

          # Safely enforce compileSdk 34 and minSdk 21 in both build.gradle and build.gradle.kts
          python3 -c "
          import os
          for path in ['android/app/build.gradle', 'android/app/build.gradle.kts']:
              if os.path.exists(path):
                  with open(path, 'r') as f:
                      c = f.read()
                  c = c.replace('minSdkVersion = flutter.minSdkVersion', 'minSdkVersion = 21')
                  c = c.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
                  c = c.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
                  c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
                  c = c.replace('compileSdkVersion = flutter.compileSdkVersion', 'compileSdkVersion = 34')
                  c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
                  c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
                  c = c.replace('targetSdkVersion = flutter.targetSdkVersion', 'targetSdkVersion = 34')
                  c = c.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
                  with open(path, 'w') as f:
                      f.write(c)
                  print(f'Successfully configured SDK levels in {path}')
          "

          flutter pub get

          echo "Starting Flutter APK build with auto-retry..."
          SUCCESS=0
          for attempt in 1 2 3; do
            echo "Build attempt $attempt..."
            if flutter build apk --debug 2>&1 | tee /tmp/flutter_build.log; then
              SUCCESS=1
              break
            else
              echo "Attempt $attempt failed. Waiting 5s before retry..."
              sleep 5
            fi
          done

          if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "❌ APK build failed! Diagnostic report:"
            echo "## ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 /tmp/flutter_build.log
            exit 1
          fi

          echo "Deterministically signing APK with repository permanent keystore..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          $APKSIGNER sign --ks /tmp/backup_app/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey --key-pass pass:android build/app/outputs/flutter-apk/app-debug.apk

          echo "Verifying compiled APK signature:"
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-debug.apk

          python3 -c "
          import subprocess
          out = subprocess.check_output(['keytool', '-printcert', '-jarfile', 'build/app/outputs/flutter-apk/app-debug.apk']).decode()
          expected_sha256 = 'DE:7F:CB:9F:62:3E:EB:CE:C1:FD:31:3C:5C:2C:1E:CC:8F:E7:3D:EA:12:63:74:78:1C:8F:8F:C6:35:16:1D:0E'
          if expected_sha256 not in out:
              print('❌ CRITICAL ERROR: APK signature does NOT match repository permanent key!')
              print(out)
              exit(1)
          print('✅ SUCCESS: APK signature is 100% verified and permanently deterministic!')
          "

      - name: Assemble Release Assets & Generate Checksums
        run: |
          mkdir -p release-files
          cp build/app/outputs/flutter-apk/app-debug.apk release-files/LINKDROP.apk

          TAG="${GITHUB_REF_NAME:-v1.0.9}"
          VERSION="${TAG#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          APK_SHA=$(sha256sum release-files/LINKDROP.apk | awk '{print $1}')

          cat <<EOF > release-files/latest.json
          {
            "version": "$VERSION",
            "release_date": "$PUB_DATE",
            "release_notes": "🚀 LINKDROP $VERSION: High-speed direct video downloader, live player preview, HTTP Range byte resumption, Khmer & English localization, and in-app auto updates.",
            "mandatory": false,
            "apk_url": "https://github.com/${{ github.repository }}/releases/download/$TAG/LINKDROP.apk",
            "sha256_apk": "$APK_SHA"
          }
          EOF

          echo "Ready to release assets:"
          ls -lh release-files
          cat release-files/latest.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-files/*
          tag_name: ${{ github.ref_name }}
          name: LINKDROP ${{ github.ref_name }}
          body: |
            ## 🚀 LINKDROP ${{ github.ref_name }} (Latest)

            Direct Video Downloader for **Android**.

            ### 📦 Direct Downloads:
            - 📱 **Android APK**: [`LINKDROP.apk`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/LINKDROP.apk)
            - 📄 **In-App Auto-Update Manifest**: [`latest.json`](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/latest.json)

            ### ✨ Highlights:
            - **Native HTTP/HTTPS Streaming**: Downloads large files chunk by chunk without memory exhaustion.
            - **HTTP Range Resume**: Pauses and resumes seamlessly from byte offset.
            - **Smart Link Detection & SSRF Defense**: Guards against private-network attacks.
            - **Live Video Preview & Offline Player**: Play and inspect videos directly inside the app.
            - **Khmer & English Support**: Switch between ភាសាខ្មែរ and English in Settings.
            - **In-App Auto-Update**: Checks GitHub Releases, verifies SHA-256 integrity, and installs updates in-app without needing a browser!
          draft: false
          prerelease: false
